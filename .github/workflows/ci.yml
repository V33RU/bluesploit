name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege: every job is read-only against the repo unless it
# explicitly overrides this. A compromised step cannot push, comment,
# tag releases, or write to issues.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# All third-party actions are pinned to a full commit SHA, not a moving
# tag. A trailing comment records the human-readable version. Dependabot
# (.github/dependabot.yml) keeps these bumped, but never mid-flight.
jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          pip install "ruff==0.15.12"

      - name: ruff check (core + scripts + entry)
        run: ruff check core scripts bluesploit.py
        # modules/ has ~1500 legacy lint issues. Cleanup is a separate
        # follow-up task; keep CI green on the actively-maintained surface.

      - name: ruff check (modules, advisory)
        continue-on-error: true
        run: ruff check modules

  validate-modules:
    name: module metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate module metadata
        run: python scripts/validate_modules.py

  test:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test deps
        # Pinned exactly. The tests under scripts/ stub anything that
        # would touch hardware, so we deliberately do NOT install the
        # full runtime deps (bluepy/btlejack need root + native libs).
        # `rich` is pure Python and is imported eagerly by core/ui/tables.
        # `cryptography` is needed for core/crypto.py (AES primitives used
        # by the modules/auxiliary/crypto pack).
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          pip install \
            "pytest==8.3.4" \
            "pytest-mock==3.14.0" \
            "pytest-cov==6.0.0" \
            "rich==15.0.0" \
            "cryptography==47.0.0"

      - name: Run tests
        run: pytest scripts -q

  typecheck:
    name: mypy (lenient, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mypy
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          pip install "mypy==1.13.0"

      - name: mypy core
        run: mypy core
